<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Serwisownik</title>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="view-auth" class="view active">
    <div class="container center">
      <img src="/logo.svg" alt="Serwisownik Logo" class="auth-logo" />
      
      <div class="form-group">
        <label for="email">Adres e-mail</label>
        <input type="email" id="email" placeholder="twoj@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Hasło</label>
        <input type="password" id="password" placeholder="********" />
      </div>
      
      <button id="btn-login" class="primary">Zaloguj się</button>
      <button id="btn-register" class="text-action">Zarejestruj się</button>
    </div>
  </div>

  <div id="view-dashboard" class="view">
    <header>
      <h2>Garaż</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        
        <button id="btn-notifications" title="Powiadomienia">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
          <span id="notif-badge" style="display: none; position: absolute; top: 0px; right: 0px; background: red; color: white; border-radius: 50%; font-size: 0.7rem; padding: 2px 5px; font-weight: bold; line-height: 1;">0</span>
        </button>   
        
        <button id="btn-logout" title="Wyloguj">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>

      </div>
    </header>
    <div class="container">
      <ul id="vehicles-list" class="card-list"></ul>
      <button id="btn-go-add-vehicle" class="text-action">+ Dodaj pojazd</button>
    </div>
  </div>

  <div id="view-notifications" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Garaż
      </button>
      <h2>Powiadomienia</h2>
    </header>
    <div class="container">
      <ul id="notifications-list" class="card-list"></ul>
    </div>
  </div>

  <div id="view-add-vehicle" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Garaż
      </button>
      <h2>Dodaj pojazd</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="veh-brand">Marka pojazdu</label>
        <input type="text" id="veh-brand" placeholder="np. Toyota" />
      </div>

      <div class="form-group">
        <label for="veh-model">Model</label>
        <input type="text" id="veh-model" placeholder="np. Yaris" />
      </div>

      <div class="form-group">
        <label for="veh-year">Rocznik</label>
        <input type="number" id="veh-year" placeholder="np. 2020" />
      </div>

      <div class="form-group">
        <label for="veh-mileage">Aktualny przebieg (km)</label>
        <input type="number" id="veh-mileage" placeholder="np. 45000" />
      </div>

      <div class="form-group">
        <label for="veh-photo">Zdjęcie pojazdu (opcjonalnie)</label>
        <input type="file" id="veh-photo" accept="image/*" class="file-input" />
      </div>

      <button id="btn-save-vehicle" class="primary">Zapisz pojazd</button>
    </div>
  </div>

  <div id="view-edit-vehicle" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Garaż
      </button>
      <h2>Edytuj pojazd</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="edit-veh-brand">Marka pojazdu</label>
        <input type="text" id="edit-veh-brand" />
      </div>

      <div class="form-group">
        <label for="edit-veh-model">Model</label>
        <input type="text" id="edit-veh-model" />
      </div>

      <div class="form-group">
        <label for="edit-veh-year">Rocznik</label>
        <input type="number" id="edit-veh-year" />
      </div>

      <div class="form-group">
        <label for="edit-veh-mileage">Aktualny przebieg (km)</label>
        <input type="number" id="edit-veh-mileage" />
      </div>

      <div class="form-group">
        <label for="edit-veh-photo">Miniaturka (opcjonalnie)</label>
        <input type="file" id="edit-veh-photo" accept="image/*" class="file-input" />
      </div>

      <div class="form-group" id="edit-veh-remove-photo-container" style="flex-direction: row; align-items: center; gap: 10px; margin-top: -5px; margin-bottom: 15px; display: none;">
        <input type="checkbox" id="edit-veh-remove-photo" style="width: auto; margin: 0; cursor: pointer;" />
        <label for="edit-veh-remove-photo" style="margin: 0; font-weight: normal; color: #e11d48; cursor: pointer;">Usuń aktualną miniaturkę</label>
      </div>

      <button id="btn-update-vehicle" class="primary">Zapisz zmiany</button>
    </div>
  </div>

  <div id="view-vehicle-details" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Garaż
      </button>
      <h2 id="detail-title">Szczegóły</h2>
    </header>
    <div class="container">
      <div class="tabs">
        <button id="tab-fuel" class="tab active">Tankowania</button>
        <button id="tab-service" class="tab">Serwis</button>
        <button id="tab-reminder" class="tab">Przypomnienia</button>
      </div>
      
      <button id="btn-show-add-fuel" class="text-action">+ Dodaj tankowanie</button>
      <button id="btn-show-add-service" class="text-action" style="display: none;">+ Dodaj wpis serwisowy</button>
      <button id="btn-show-add-reminder" class="text-action" style="display: none;">+ Dodaj przypomnienie</button>
      
      <ul id="records-list" class="card-list" style="margin-top: 15px;"></ul>
    </div>
  </div>

  <div id="view-add-fuel" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Dodaj tankowanie</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="fuel-date">Data tankowania</label>
        <input type="date" id="fuel-date" />
      </div>
      <div class="form-group">
        <label for="fuel-mileage">Przebieg (km)</label>
        <input type="number" id="fuel-mileage" placeholder="np. 150200" />
      </div>
      <div class="form-group">
        <label for="fuel-liters">Ilość litrów</label>
        <input type="number" id="fuel-liters" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="fuel-cost">Koszt całkowity (PLN)</label>
        <input type="number" id="fuel-cost" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="fuel-file">Załącznik (opcjonalnie)</label>
        <input type="file" id="fuel-file" accept="image/*" capture="environment" class="file-input" />
      </div>
      <button id="btn-save-fuel" class="primary">Zapisz tankowanie</button>
    </div>
  </div>

  <div id="view-edit-fuel" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Edytuj tankowanie</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="edit-fuel-date">Data tankowania</label>
        <input type="date" id="edit-fuel-date" />
      </div>
      <div class="form-group">
        <label for="edit-fuel-mileage">Przebieg (km)</label>
        <input type="number" id="edit-fuel-mileage" />
      </div>
      <div class="form-group">
        <label for="edit-fuel-liters">Ilość litrów</label>
        <input type="number" id="edit-fuel-liters" />
      </div>
      <div class="form-group">
        <label for="edit-fuel-cost">Koszt całkowity (PLN)</label>
        <input type="number" id="edit-fuel-cost" />
      </div>
      <div class="form-group">
        <label for="edit-fuel-file">Aktualizuj załącznik (opcjonalnie)</label>
        <input type="file" id="edit-fuel-file" accept="image/*" capture="environment" class="file-input" />
      </div>
      <button id="btn-update-fuel" class="primary">Zapisz zmiany</button>
    </div>
  </div>

  <div id="view-add-service" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Dodaj serwis</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="srv-date">Data naprawy / serwisu</label>
        <input type="date" id="srv-date" />
      </div>
      <div class="form-group">
        <label for="srv-desc">Opis serwisu</label>
        <input type="text" id="srv-desc" placeholder="np. Wymiana oleju" />
      </div>
      <div class="form-group">
        <label for="srv-mileage">Przebieg (km)</label>
        <input type="number" id="srv-mileage" placeholder="np. 155000" />
      </div>
      <div class="form-group">
        <label for="srv-cost">Koszt całkowity (PLN)</label>
        <input type="number" id="srv-cost" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="srv-file">Załącznik (opcjonalnie)</label>
        <input type="file" id="srv-file" accept="image/*" capture="environment" class="file-input" />
      </div>
      <button id="btn-save-service" class="primary">Zapisz wpis serwisowy</button>
    </div>
  </div>

  <div id="view-edit-service" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Edytuj serwis</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="edit-srv-date">Data naprawy</label>
        <input type="date" id="edit-srv-date" />
      </div>
      <div class="form-group">
        <label for="edit-srv-desc">Opis serwisu</label>
        <input type="text" id="edit-srv-desc" />
      </div>
      <div class="form-group">
        <label for="edit-srv-mileage">Przebieg (km)</label>
        <input type="number" id="edit-srv-mileage" />
      </div>
      <div class="form-group">
        <label for="edit-srv-cost">Koszt całkowity (PLN)</label>
        <input type="number" id="edit-srv-cost" />
      </div>
      <div class="form-group">
        <label for="edit-srv-file">Aktualizuj załącznik (opcjonalnie)</label>
        <input type="file" id="edit-srv-file" accept="image/*" capture="environment" class="file-input" />
      </div>
      <button id="btn-update-service" class="primary">Zapisz zmiany</button>
    </div>
  </div>

  <div id="view-add-reminder" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Dodaj przypomnienie</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="rem-title">Tytuł przypomnienia</label>
        <input type="text" id="rem-title" placeholder="np. Ubezpieczenie OC" />
      </div>
      <div class="form-group">
        <label for="rem-date">Termin (Data)</label>
        <input type="date" id="rem-date" />
      </div>
      <div class="form-group">
        <label for="rem-mileage">Lub przy przebiegu (km)</label>
        <input type="number" id="rem-mileage" placeholder="np. 180000" />
      </div>
      <button id="btn-save-reminder" class="primary">Zapisz przypomnienie</button>
    </div>
  </div>

  <div id="view-edit-reminder" class="view">
    <header>
      <button class="btn-back btn-header-back" data-target="view-vehicle-details">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Wstecz
      </button>
      <h2>Edytuj przypomnienie</h2>
    </header>
    <div class="container">
      <div class="form-group">
        <label for="edit-rem-title">Tytuł przypomnienia</label>
        <input type="text" id="edit-rem-title" />
      </div>
      <div class="form-group">
        <label for="edit-rem-date">Termin (Data)</label>
        <input type="date" id="edit-rem-date" />
      </div>
      <div class="form-group">
        <label for="edit-rem-mileage">Lub przy przebiegu (km)</label>
        <input type="number" id="edit-rem-mileage" />
      </div>
      <button id="btn-update-reminder" class="primary">Zapisz zmiany</button>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
